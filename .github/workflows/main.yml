name: Main Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: 'Release'
  PACKAGE_ID: 'WormDev-github.NG.LM.IdentityGenerator'

jobs:
  
  continuous-integration:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.VERSION }}
    permissions:
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for versioning
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore
      
      - name: Run unit tests
        run: dotnet test src/**/*.Tests.csproj --configuration ${{ env.CONFIGURATION }} --verbosity normal --no-build
      
      - name: Install Nerdbank.GitVersioning
        run: dotnet tool install --global nbgv

      - name: Determine version
        id: nbgv
        run: |
          VERSION=$(nbgv get-version -v NuGetPackageVersion)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version will be: $VERSION"

      - name: Pack
        run: dotnet pack src/NG.LM.IdentityGenerator.Core/NG.LM.IdentityGenerator.Core.csproj --configuration ${{ env.CONFIGURATION }} --output package -p:PackageId=${{ env.PACKAGE_ID }} -p:PackageVersion=${{ steps.nbgv.outputs.VERSION }}

      - name: Publish to GitHub Packages (Pre-release)
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push ./package/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: package/*.nupkg
  
  # Stage 1: Pre-release (Automatic, Private)
  pre-release:
    needs: continuous-integration
    runs-on: ubuntu-latest
    environment:
      name: pre-release
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: package

      - name: Promote to Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.continuous-integration.outputs.version }}"
          git tag "v$VERSION-pre-release"
          git push origin "v$VERSION-pre-release"
          gh release create "v$VERSION-pre-release" \
            --title "v$VERSION (Pre-release)" \
            --notes "Pre-release version $VERSION" \
            --prerelease \
            ./package/*.nupkg

  # Example Release Quality Gates Release (Manual Approval Required, Private)
  # Example Level 2: Inter-Department / Inter-Product Environment (Enterprise Release):
  # - Integration Testing: Verifies that your package interacts correctly with neighboring modules and local databases.
  # - Software Composition Analysis (SCA): Scans open-source dependencies used by the package for licensing compliance and known security vulnerabilities.
  # - API Contract Testing: Confirms that API inputs and outputs have not changed, preventing breaking changes for sister teams.
  # - Basic Performance Profiling: Checks that the package does not cause memory leaks or severe CPU spikes under light usage.
  release:
    needs: [continuous-integration, pre-release]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Promote to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.continuous-integration.outputs.version }}"
          git tag "v$VERSION-release"
          git push origin "v$VERSION-release"
          gh release edit "v$VERSION-pre-release" \
            --tag "v$VERSION-release" \
            --title "v$VERSION (Release)" \
            --prerelease=false \
            --latest=false \
            --notes "Release version $VERSION"
  #test
  # Example Publish Quality Gates: Inter-Department / Inter-Product Environment (Enterprise Release):
  # - Dynamic Application Security Testing (DAST): Tests the running, integrated application from the outside to mimic a hacker trying to exploit vulnerabilities.
  # - Load and Stress Testing: Simulates high user traffic to prove the package can handle production-level data volumes.
  # - Backward Compatibility Verification: Ensures that other departments using older versions of your APIs or data schemas will not experience system failures.
  # - Regulated Compliance Audits: Automates checks for legal requirements, data privacy (like GDPR), and organizational governance.

  # Stage 3: Publish (Manual Approval Required, Public)
  publish:
    needs: [continuous-integration, pre-release, release]
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Promote to Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.continuous-integration.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release edit "v$VERSION-release" \
            --tag "v$VERSION" \
            --title "v$VERSION" \
            --notes "Publish version $VERSION" \
            --prerelease=false \
            --latest